<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多頭排列卡片展示</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- 引入 Babel 用於解析 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-950 flex items-center justify-center min-h-screen">

  <!-- React 元件掛載點 -->
  <div id="root"></div>

  <!-- React 程式碼 -->
  <script type="text/babel">
    const { useState } = React;

    function BullishTargetCard() {
      const [targetCount, setTargetCount] = useState(0);
      const [isLoading, setIsLoading] = useState(false);

      // 查看標的列表邏輯
      const handleViewTargets = () => {
        alert('開啟 1H 多頭排列標的面板/清單');
      };

      // 重新整理數據邏輯
      const refreshData = () => {
        setIsLoading(true);
        setTimeout(() => {
          setTargetCount(prev => prev + 1);
          setIsLoading(false);
        }, 600);
      };

      return (
        <div className="w-80 p-6 rounded-2xl bg-[#0f0e17] border border-[#ff0055]/30 shadow-[0_0_20px_rgba(255,0,85,0.15)] flex flex-col items-center gap-5 text-center transition-all duration-300 hover:border-[#ff0055]/60">
          
          {/* 上方圖示與數字 */}
          <div className="flex flex-col items-center justify-center">
            <div className="w-8 h-12 rounded-full border-2 border-[#ff0055] flex items-center justify-center shadow-[0_0_10px_#ff0055]">
              <div className="w-2 h-2 rounded-full bg-[#ff0055] shadow-[0_0_5px_#ff0055]" />
            </div>
            <span className="text-4xl font-bold text-[#ff0055] mt-1 drop-shadow-[0_0_8px_#ff0055]">
              {targetCount}
            </span>
          </div>

          {/* 標題與說明 */}
          <div className="space-y-1">
            <h3 className="text-gray-200 text-lg font-semibold tracking-wide flex items-center justify-center gap-2">
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
              符合 1H 多頭排列標的
            </h3>
            <p className="text-xs text-gray-500">每 60 秒自動更新策略指標</p>
          </div>

          {/* 按鈕組 */}
          <div className="w-full flex flex-col gap-2.5 pt-2">
            <!-- 主按鈕：查看標的 -->
            <button
              onClick={handleViewTargets}
              className="w-full py-2.5 px-4 rounded-xl bg-[#ff0055] hover:bg-[#ff2277] active:scale-[0.98] text-white font-semibold transition-all duration-200 shadow-[0_0_12px_rgba(255,0,85,0.4)] hover:shadow-[0_0_18px_rgba(255,0,85,0.6)] cursor-pointer flex items-center justify-center gap-2"
            >
              <span>查看 1H 多頭標的</span>
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />
              </svg>
            </button>

            <!-- 次要按鈕：重新整理 -->
            <button
              onClick={refreshData}
              disabled={isLoading}
              className="w-full py-2 px-4 rounded-xl bg-[#1a1926] hover:bg-[#252336] text-gray-400 hover:text-gray-200 text-xs font-medium border border-gray-800 transition-colors duration-200 flex items-center justify-center gap-1.5 cursor-pointer disabled:opacity-50"
            >
              <svg 
                className={`w-3.5 h-3.5 ${isLoading ? 'animate-spin' : ''}`} 
                fill="none" 
                stroke="currentColor" 
                viewBox="0 0 24 24"
              >
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
              </svg>
              {isLoading ? '更新中...' : '發送即時重新整理'}
            </button>
          </div>

        </div>
      );
    }

    // 將元件渲染至 DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BullishTargetCard />);
  </script>
</body>
</html>
